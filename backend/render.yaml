# render.yaml — إعداد النشر على Render.com
# ضع هذا الملف في جذر مجلد sawa-backend

services:
  - type: web
    name: sawa-backend
    runtime: python
    region: frankfurt  # أقرب لمنطقتنا العربية
    plan: starter       # $7/شهر — 2GB RAM — يكفي لـ Whisper base
    
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    
    # متغيرات البيئة — ستضيفها يدوياً في لوحة Render
    envVars:
      - key: WHISPER_MODEL
        value: base          # base يعمل على 2GB RAM — large-v3 يحتاج 4GB
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: ENVIRONMENT
        value: production
      - key: UPLOAD_DIR
        value: /tmp/uploads  # مؤقت — سنستخدم R2 لاحقاً
      - key: DATABASE_URL
        sync: false          # ستضيفها يدوياً من Supabase
      - key: SECRET_KEY
        generateValue: true  # Render يولّدها تلقائياً
      - key: ANTHROPIC_API_KEY
        sync: false          # ستضيفها يدوياً
      - key: FRONTEND_URL
        sync: false          # رابط Vercel — ستضيفه بعد النشر
      - key: SENTRY_DSN
        sync: false          # اختياري — Sentry DSN لمراقبة الأخطاء
      - key: R2_BUCKET_NAME
        sync: false          # Cloudflare R2 — اختياري
      - key: R2_ENDPOINT
        sync: false          # https://<account-id>.r2.cloudflarestorage.com
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

    # قرص مستمر للملفات المؤقتة
    disk:
      name: uploads
      mountPath: /tmp/uploads
      sizeGB: 5              # $1/شهر إضافي — يكفي للبداية

  # ── Celery Worker ──
  - type: worker
    name: sawa-celery-worker
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.worker:celery_app worker --loglevel=info
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

  # ── Celery Beat (periodic tasks) ──
  - type: worker
    name: sawa-celery-beat
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.worker:celery_app beat --loglevel=info
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
